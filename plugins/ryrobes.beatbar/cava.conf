[general]
framerate = 30
bars = 24
autosens = 1
sensitivity = 100
lower_cutoff_freq = 45
higher_cutoff_freq = 16000
sleep_timer = 2

[input]
method = pipewire
source = auto
sample_rate = 48000
active = 1
remix = 1
virtual = 1

[output]
method = raw
channels = stereo
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 65
