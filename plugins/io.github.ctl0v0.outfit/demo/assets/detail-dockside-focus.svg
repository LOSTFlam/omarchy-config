<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Dockside — a little room to focus</title>
  <desc id="description">Fictional desktop illustration. A small focus popover sits under Dockside in the host bar while a writing window and a warm abstract landscape remain visible. The timer is invented and static.</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#575750"/><stop offset=".65" stop-color="#343f3e"/><stop offset="1" stop-color="#263536"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#948267"/><stop offset="1" stop-color="#636654"/>
    </linearGradient>
    <clipPath id="desktop"><rect width="1440" height="900" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#desktop)">
    <path fill="url(#dusk)" d="M0 0h1440v900H0z"/>
    <circle cx="1067" cy="451" r="228" fill="#c2b58c" opacity=".6"/>
