      <text x="1321" y="32" fill="#a2b197">EN · 72%</text>
    </g>
    <!-- A quiet editor stays in the foreground; the timer occupies little room. -->
    <rect x="86" y="157" width="785" height="582" rx="7" fill="#13251f" opacity=".25"/>
    <rect x="79" y="148" width="785" height="582" rx="6" fill="#22302b" stroke="#71806a"/>
    <path d="M85 148h773q6 0 6 6v43H79v-43q0-6 6-6" fill="#2d3d33"/>
    <g font-family="monospace" font-size="14">
      <text x="103" y="179" fill="#cad2bd">Letters</text>
      <text x="479" y="179" text-anchor="middle" fill="#a0af94">a-note-for-a-slower-day.md</text>
      <path d="M791 174h10m18-4 10 10m0-10-10 10" stroke="#a0af94" stroke-width="1.5"/>
      <path d="M79 197h785" stroke="#445542"/>
      <text x="156" y="265" font-size="11" letter-spacing="3" fill="#abb99b">SUNDAY LETTERS / DRAFT 04</text>
      <text x="155" y="327" font-size="31" fill="#e4e6d4">A note for a slower day.</text>
      <g font-size="16" fill="#bac7ac">
        <text x="156" y="385">There is a small kind of progress</text>
        <text x="156" y="415">in giving one thing your attention.</text>
        <text x="156" y="475">A paragraph. A sketch. A cup of tea</text>
        <text x="156" y="505">that you remember to drink while warm.</text>
        <text x="156" y="565">Today, that is enough.</text>
      </g>
      <path d="M369 548v21" stroke="#c2ceaa" stroke-width="2"/>
      <path d="M156 623h627" stroke="#445542"/>
      <text x="156" y="656" font-size="12" fill="#8ea082">No hurry. You have a little room.</text>
      <text x="104" y="709" font-size="12" fill="#8ea082">43 words</text>
      <text x="840" y="709" text-anchor="end" font-size="12" fill="#8ea082">Saved locally · Fictional draft</text>
    </g>
    <!-- Compact focus mode, with the host bar visible above it. -->
    <rect x="963" y="86" width="418" height="486" rx="7" fill="#15231e" opacity=".3"/>
    <rect x="956" y="77" width="418" height="486" rx="6" fill="#1e2d27" stroke="#839078"/>
