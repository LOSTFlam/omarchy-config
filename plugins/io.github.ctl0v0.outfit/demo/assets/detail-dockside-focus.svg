      <text x="74" y="32">1</text><text x="111" y="32">2</text>
      <rect x="139" y="10" width="35" height="32" rx="4" fill="#3a4c42"/>
      <text x="156" y="32" text-anchor="middle" fill="#e5e7d7">3</text><text x="192" y="32">4</text>
      <text x="254" y="32" fill="#97a891">Sunday letters</text>
      <text x="720" y="32" text-anchor="middle">Thu 17 · 16:08</text>
