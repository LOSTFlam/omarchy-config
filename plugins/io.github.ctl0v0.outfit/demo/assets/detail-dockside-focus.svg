      <path d="M1165 234a69 69 0 1 1-69 69" fill="none" stroke="#bdcaa1" stroke-width="5" stroke-linecap="round"/>
      <text x="1165" y="307" text-anchor="middle" font-size="32" fill="#e0e4cf">18:42</text>
      <text x="1165" y="330" text-anchor="middle" font-size="11" fill="#a8b89b">OF 25 MINUTES</text>
      <rect x="982" y="397" width="176" height="42" rx="4" fill="#bcc9a6"/>
      <text x="1070" y="424" text-anchor="middle" font-size="14" fill="#253629">Pause</text>
      <rect x="1172" y="397" width="176" height="42" rx="4" fill="#2b3e30" stroke="#617358"/>
      <text x="1260" y="424" text-anchor="middle" font-size="14">Finish</text>
      <path d="M982 465h366" stroke="#465842"/>
      <text x="982" y="496" font-size="12" fill="#a8b89b">Keep writing. We’ll keep the time.</text>
      <text x="982" y="524" font-size="11" fill="#849978">2 sessions today · Fictional activity</text>
    </g>
    <g font-family="monospace" fill="#cad2bb" font-size="12" letter-spacing="2">
      <text x="60" y="853">DOCKSIDE / 03</text>
      <text x="1381" y="853" text-anchor="end" opacity=".75">FICTIONAL DESKTOP · DESIGN PREVIEW</text>
